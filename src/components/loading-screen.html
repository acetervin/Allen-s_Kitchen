<!-- Brand Loader -->
<div id="brand-loader" class="ak-loader-root">
    <div class="ak-noise"></div>
    <div class="ak-corner ak-corner-tl"></div>
    <div class="ak-corner ak-corner-tr"></div>
    <div class="ak-corner ak-corner-bl"></div>
    <div class="ak-corner ak-corner-br"></div>
    <div class="ak-wrap">
        <div class="ak-glow"></div>
        <div class="ak-ring ak-ring-1"></div>
        <div class="ak-ring ak-ring-2"></div>
        <div class="ak-content">
            <div class="ak-est">Est. Nairobi</div>
            <div class="ak-title">Fusions Choma joint</div>
            <div class="ak-tagline">"You Again??"</div>
        </div>
        <div class="ak-divider"></div>
        <div class="ak-bar-wrap">
            <div class="ak-bar-track">
                <div id="loader-fill" class="ak-bar-fill" style="width: 0%"></div>
            </div>
            <div class="ak-bar-meta">
                <span class="ak-loading-text">Preparing</span>
                <span id="loader-percent" class="ak-percent">0%</span>

        </div>
    </div>
    <div class="ak-nairobi">Nairobi · Kenya</div>
